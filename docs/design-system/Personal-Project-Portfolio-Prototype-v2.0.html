<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal Portfolio Studio</title>
<style>
:root{--ink:#17243a;--muted:#718096;--blue:#315eab;--accent:#6d8fe8;--bg:#f4f6fa;--line:#e5eaf1;--white:#fff;--green:#16845b;--shadow:0 12px 35px rgba(25,45,75,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Inter,"Noto Sans KR",system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}.brand{font-weight:800;font-size:17px;letter-spacing:-.4px}.brand span{color:var(--blue)}.switch{display:flex;gap:6px;background:#f1f4f8;padding:4px;border-radius:11px}.switch button{padding:8px 13px;border-radius:8px;background:transparent;color:#637187}.switch button.active{background:#fff;color:var(--blue);box-shadow:0 2px 8px #1b31501a}.layout{display:flex;max-width:1440px;margin:auto}.side{width:230px;padding:26px 16px;flex-shrink:0}.side small{display:block;color:#9aa5b5;font-size:10px;font-weight:800;letter-spacing:1.3px;margin:12px 12px}.nav{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 13px;margin:3px 0;background:transparent;color:#64748b;border-radius:10px}.nav.active,.nav:hover{background:#e9effa;color:var(--blue);font-weight:700}.main{min-width:0;flex:1;padding:34px 34px 70px}.wrap{max-width:1100px;margin:auto}.eyebrow{color:var(--blue);font-size:11px;font-weight:800;letter-spacing:1.4px}.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}.heading h1{font-size:28px;line-height:1.2;margin:5px 0}.muted{color:var(--muted)}.btn{padding:10px 15px;border-radius:10px;font-weight:700;background:var(--blue);color:white;box-shadow:0 5px 12px #315eab25}.btn.light{background:white;color:var(--ink);border:1px solid var(--line);box-shadow:none}.btn.danger{background:#fff0f0;color:#b53d3d;box-shadow:none}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.metric label{font-size:12px;color:var(--muted)}.metric strong{display:block;font-size:28px;margin:7px 0 2px}.metric em{font-style:normal;color:var(--green);font-size:11px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:21px;margin-top:18px}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.panel h2{font-size:16px;margin:0}.project{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid #edf0f5}.thumb{width:48px;height:48px;border-radius:13px;background:linear-gradient(135deg,#dfe9ff,#b7cafa);display:grid;place-items:center;font-size:20px}.project-info{flex:1;min-width:0}.project-info b{display:block}.project-info small{color:var(--muted)}.pill{display:inline-block;padding:4px 8px;border-radius:30px;background:#edf3ff;color:#315eab;font-size:11px;font-weight:700}.pill.green{background:#e8f6ef;color:#16845b}.pill.gray{background:#f0f2f5;color:#657286}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:6px;margin:13px 0}.field label{font-weight:700;font-size:12px}.field input,.field textarea,.field select{border:1px solid #dce3ed;border-radius:10px;padding:11px 12px;background:#fff;color:var(--ink);width:100%}.field textarea{min-height:86px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.repo{border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}.repo a{color:var(--blue);word-break:break-all}.empty{text-align:center;padding:45px;color:var(--muted)}.hidden{display:none!important}.public{max-width:1080px;margin:auto;padding:42px 26px}.pubnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:76px}.hero{max-width:760px;margin-bottom:54px}.hero h1{font-size:clamp(34px,6vw,58px);line-height:1.12;letter-spacing:-2px;margin:14px 0}.hero p{font-size:17px;color:#64748b;max-width:620px}.pubsection{margin:55px 0}.pubsection h2{font-size:23px}.pubcards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.pubcard{background:#fff;border:1px solid var(--line);border-radius:17px;padding:22px}.pubcard h3{margin:8px 0}.tag{font-size:11px;color:#60718a;background:#f0f3f8;padding:5px 8px;border-radius:20px;margin:3px;display:inline-block}.modalback{position:fixed;inset:0;background:#101d32a8;display:grid;place-items:center;padding:18px;z-index:10}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:white;border-radius:18px;padding:24px;box-shadow:0 25px 70px #0003}.modalhead{display:flex;justify-content:space-between;align-items:center}.toast{position:fixed;bottom:22px;right:22px;background:#17243a;color:white;padding:12px 17px;border-radius:11px;z-index:20}.mobilebar{display:none}
@media(max-width:850px){.side{width:190px}.main{padding:25px 20px}.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.top{height:60px;padding:0 14px}.brand{font-size:15px}.switch button{padding:7px 9px;font-size:11px}.side{display:none}.main{padding:24px 15px 90px}.heading{align-items:flex-start;flex-direction:column}.heading h1{font-size:24px}.grid{gap:9px}.card{padding:14px}.metric strong{font-size:24px}.formgrid,.pubcards{grid-template-columns:1fr}.project{align-items:flex-start}.project .row:last-child{margin-left:auto}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);justify-content:space-around;padding:9px 3px calc(9px + env(safe-area-inset-bottom));z-index:4}.mobilebar button{background:transparent;color:#718096;font-size:10px}.mobilebar button.active{color:var(--blue);font-weight:800}.public{padding:25px 18px}.pubnav{margin-bottom:55px}.hero h1{letter-spacing:-1.2px}.hero p{font-size:15px}}
</style></head><body><div class="app">
<header class="top"><div class="brand">PORTFOLIO<span>·</span>STUDIO</div><div class="switch"><button id="adminMode" class="active" onclick="setMode('admin')">관리자 화면</button><button id="publicMode" onclick="setMode('public')">공개 포트폴리오</button></div></header>
<div id="adminApp" class="layout"><aside class="side"><small>WORKSPACE</small><button class="nav active" data-page="dashboard" onclick="page('dashboard')">▦　대시보드</button><button class="nav" data-page="projects" onclick="page('projects')">▤　프로젝트 관리</button><button class="nav" data-page="repositories" onclick="page('repositories')">⌘　Git 저장소</button><button class="nav" data-page="careers" onclick="page('careers')">▣　경력 및 기술</button><button class="nav" data-page="portfolio" onclick="page('portfolio')">◎　포트폴리오 설정</button><small>SETTINGS</small><button class="nav" data-page="settings" onclick="page('settings')">⚙　설정</button></aside><main class="main"><div class="wrap" id="adminContent"></div></main></div>
<div id="publicApp" class="hidden"><main class="public" id="publicContent"></main></div>
<nav class="mobilebar"><button data-page="dashboard" onclick="page('dashboard')">▦<br>홈</button><button data-page="projects" onclick="page('projects')">▤<br>프로젝트</button><button data-page="repositories" onclick="page('repositories')">⌘<br>저장소</button><button data-page="portfolio" onclick="page('portfolio')">◎<br>공개설정</button></nav>
<div id="modalRoot"></div><div id="toastRoot"></div></div>
<script>
const seed=[{id:1,title:"프로젝트 포트폴리오 플랫폼",summary:"개인 프로젝트와 개발 이력을 통합 관리하는 포트폴리오 서비스",status:"진행 중",visibility:"공개",skills:"React, NestJS, PostgreSQL",role:"기획·설계·개발",outcome:"관리와 공개 포트폴리오의 통합 관리",repos:[{name:"portfolio-web",url:"https://github.com/example/portfolio-web",branch:"main",vis:"Public",readme:"",deploy:"",primary:true},{name:"portfolio-api",url:"https://github.com/example/portfolio-api",branch:"develop",vis:"Private",readme:"",deploy:"",primary:false}]},{id:2,title:"자동화 워크플로 빌더",summary:"반복 업무를 시각적 워크플로로 구성하는 자동화 도구",status:"기획",visibility:"비공개",skills:"React Flow, Node.js",role:"아키텍처 설계",outcome:"워크플로 버전 및 실행 구조 설계",repos:[]},{id:3,title:"개인 지식 관리 도구",summary:"기술 학습과 업무 지식을 구조화하는 지식 관리 도구",status:"완료",visibility:"공개",skills:"Next.js, Markdown",role:"설계·개발",outcome:"지식 문서화 흐름 구축",repos:[]}];
let projects=JSON.parse(localStorage.getItem("pps_projects")||"null")||seed;let current="dashboard",mode="admin";
function save(){localStorage.setItem("pps_projects",JSON.stringify(projects))}
function toast(s){document.getElementById("toastRoot").innerHTML='<div class="toast">'+s+'</div>';setTimeout(()=>document.getElementById("toastRoot").innerHTML="",2200)}
function setMode(m){mode=m;document.getElementById("adminApp").classList.toggle("hidden",m!=="admin");document.getElementById("publicApp").classList.toggle("hidden",m!=="public");document.getElementById("adminMode").classList.toggle("active",m==="admin");document.getElementById("publicMode").classList.toggle("active",m==="public");if(m==="public")renderPublic();else page(current)}
function page(p){current=p;document.querySelectorAll(".nav").forEach(x=>x.classList.toggle("active",x.dataset.page===p));document.querySelectorAll(".mobilebar button").forEach(x=>x.classList.toggle("active",x.dataset.page===p));renderAdmin()}
function head(k,t,desc,action=""){return `<div class="heading"><div><div class="eyebrow">${k}</div><h1>${t}</h1><div class="muted">${desc}</div></div>${action}</div>`}
function renderAdmin(){let c=document.getElementById("adminContent"),active=projects.filter(p=>p.status==="진행 중").length,pub=projects.filter(p=>p.visibility==="공개").length;
if(current==="dashboard"){c.innerHTML=head("OVERVIEW","대시보드","프로젝트 현황과 포트폴리오 운영 상태를 확인하세요.",'<button class="btn" onclick="editProject()">＋ 프로젝트 등록</button>')+`<div class="grid"><div class="card metric"><label>전체 프로젝트</label><strong>${projects.length}</strong><em>등록된 프로젝트</em></div><div class="card metric"><label>진행 중</label><strong>${active}</strong><em>현재 작업</em></div><div class="card metric"><label>완료</label><strong>${projects.filter(p=>p.status==="완료").length}</strong><em>완료 프로젝트</em></div><div class="card metric"><label>공개 프로젝트</label><strong>${pub}</strong><em>외부 노출 가능</em></div></div><section class="panel"><div class="panelhead"><h2>최근 프로젝트</h2><button class="btn light" onclick="page('projects')">전체 보기</button></div>${projects.slice(0,4).map(projectRow).join("")}</section><section class="panel"><div class="panelhead"><h2>포트폴리오 게시 상태</h2><span class="pill green">${pub}개 공개</span></div><p class="muted">공개 화면에는 공개 상태인 프로젝트만 표시됩니다. 저장소 공개 여부는 프로젝트 공개 여부와 별도로 관리됩니다.</p><button class="btn light" onclick="setMode('public')">공개 화면 미리보기 →</button></section>`}
else if(current==="projects"){c.innerHTML=head("MANAGEMENT","프로젝트 관리","프로젝트 정보와 공개 상태를 관리합니다.",'<button class="btn" onclick="editProject()">＋ 프로젝트 등록</button>')+`<section class="panel"><div class="row"><input id="q" placeholder="프로젝트 검색" oninput="filterProjects()" style="flex:1;padding:11px;border:1px solid var(--line);border-radius:9px"><select id="f" onchange="filterProjects()" style="padding:11px;border:1px solid var(--line);border-radius:9px"><option value="">전체 상태</option><option>기획</option><option>진행 중</option><option>완료</option><option>보류</option></select></div><div id="projectRows">${projects.map(projectRow).join("")}</div></section>`}
else if(current==="repositories"){let all=projects.flatMap(p=>p.repos.map(r=>({...r,project:p.title,pid:p.id})));c.innerHTML=head("GIT INTEGRATION","Git 저장소 관리","프로젝트별 다중 저장소와 공개 정책을 관리합니다.")+`<section class="panel"><div class="muted">저장소 ${all.length}개 · 수동 등록 모드</div>${all.length?all.map(r=>`<div class="repo"><div class="row"><b>${r.name}</b><span class="pill ${r.vis==="Public"?"green":"gray"}">${r.vis}</span>${r.primary?'<span class="pill">대표</span>':""}</div><div class="muted">${r.project}</div><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.url)}</a><div class="muted">Branch: ${esc(r.branch||"-")}</div><button class="btn light" style="margin-top:8px" onclick="editProject(${r.pid})">프로젝트 저장소 편집</button></div>`).join(""):'<div class="empty">등록된 저장소가 없습니다.</div>'}</section>`}
else if(current==="careers"){c.innerHTML=head("PROFILE DATA","경력 및 기술","공개 포트폴리오에 표시할 경력과 전문 기술을 관리합니다.")+`<section class="panel"><h2>경력 관리</h2><p class="muted">회사, 직무, 기간, 주요 수행 업무를 관리하는 기능은 API/DB 구현 단계에서 확장합니다.</p><div class="repo">경력 항목 예시 · IT 시스템 개발 / 분석·설계·개발</div></section><section class="panel"><h2>기술 스택</h2><p><span class="tag">React</span><span class="tag">Node.js</span><span class="tag">Java</span><span class="tag">Spring Boot</span><span class="tag">Oracle</span><span class="tag">PostgreSQL</span></p><p class="muted">현재 프로토타입에서는 프로젝트별 기술 태그를 입력합니다.</p></section>`}
else if(current==="portfolio"){c.innerHTML=head("PUBLISHING","포트폴리오 설정","공개 화면에 노출할 프로젝트를 선택하고 미리보기합니다.")+`<section class="panel"><div class="panelhead"><h2>프로젝트 공개 설정</h2><button class="btn light" onclick="setMode('public')">미리보기</button></div>${projects.map(p=>`<div class="project"><div class="project-info"><b>${esc(p.title)}</b><small>${p.visibility} · ${p.status}</small></div><select onchange="setVisibility(${p.id},this.value)" style="padding:8px;border:1px solid var(--line);border-radius:8px"><option ${p.visibility==="공개"?"selected":""}>공개</option><option ${p.visibility==="비공개"?"selected":""}>비공개</option></select></div>`).join("")}</section>`}
else{c.innerHTML=head("SETTINGS","설정","서비스 기본 정보와 운영 정책")+'<section class="panel"><h2>서비스 정보</h2><p class="muted">Personal Project Portfolio Studio · v2.0 Prototype</p><p class="muted">이 시안은 브라우저 localStorage에 테스트 데이터를 저장합니다. 실제 로그인·서버 API·DB 연동은 포함하지 않습니다.</p></section>'}}
function projectRow(p){return `<div class="project"><div class="thumb">▣</div><div class="project-info"><b>${esc(p.title)}</b><small>${esc(p.summary)}</small><div style="margin-top:6px"><span class="pill">${p.status}</span> <span class="pill ${p.visibility==="공개"?"green":"gray"}">${p.visibility}</span></div></div><div class="row"><button class="btn light" onclick="editProject(${p.id})">편집</button><button class="btn light" onclick="detail(${p.id})">상세</button></div></div>`}
function filterProjects(){let q=document.getElementById("q").value.toLowerCase(),f=document.getElementById("f").value;document.getElementById("projectRows").innerHTML=projects.filter(p=>(!f||p.status===f)&&(p.title+p.summary).toLowerCase().includes(q)).map(projectRow).join("")||'<div class="empty">검색 결과가 없습니다.</div>'}
function editProject(id){let p=projects.find(x=>x.id===id)||{title:"",summary:"",status:"기획",visibility:"비공개",skills:"",role:"",outcome:"",repos:[]};let isNew=!id;document.getElementById("modalRoot").innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>${isNew?"프로젝트 등록":"프로젝트 수정"}</h2><button class="btn light" onclick="closeModal()">닫기</button></div><form onsubmit="saveProject(event,${id||0})"><div class="field"><label>프로젝트명 *</label><input name="title" required value="${esc(p.title)}"></div><div class="field"><label>프로젝트 요약</label><textarea name="summary">${esc(p.summary)}</textarea></div><div class="formgrid"><div class="field"><label>상태</label><select name="status">${["기획","진행 중","완료","보류"].map(x=>`<option ${p.status===x?"selected":""}>${x}</option>`)}</select></div><div class="field"><label>공개 여부</label><select name="visibility">${["공개","비공개"].map(x=>`<option ${p.visibility===x?"selected":""}>${x}</option>`)}</select></div></div><div class="field"><label>담당 역할</label><input name="role" value="${esc(p.role)}"></div><div class="field"><label>기술 스택 (쉼표 구분)</label><input name="skills" value="${esc(p.skills)}"></div><div class="field"><label>성과 및 결과</label><textarea name="outcome">${esc(p.outcome)}</textarea></div><div class="panel"><div class="panelhead"><h2>Git 저장소</h2><button type="button" class="btn light" onclick="addRepoField()">＋ 저장소 추가</button></div><div id="repoFields">${(p.repos||[]).map(repoField).join("")}</div><p class="muted">저장소 URL은 예시가 아닌 실제 연결 주소를 입력하세요. Private 저장소는 공개 화면에 표시되지 않습니다.</p></div><div class="row" style="justify-content:flex-end;margin-top:18px"><button type="button" class="btn light" onclick="closeModal()">취소</button><button class="btn">저장</button></div></form></div></div>`}
function repoField(r={name:"",url:"",branch:"main",vis:"Public",readme:"",deploy:"",primary:false}){return `<div class="repo"><div class="formgrid"><div class="field"><label>저장소 이름</label><input data-r="name" value="${esc(r.name)}"></div><div class="field"><label>브랜치</label><input data-r="branch" value="${esc(r.branch)}"></div></div><div class="field"><label>Repository URL</label><input data-r="url" type="url" placeholder="https://github.com/owner/repo" value="${esc(r.url)}"></div><div class="formgrid"><div class="field"><label>공개 범위</label><select data-r="vis"><option ${r.vis==="Public"?"selected":""}>Public</option><option ${r.vis==="Private"?"selected":""}>Private</option></select></div><div class="field"><label>README URL</label><input data-r="readme" value="${esc(r.readme||"")}"></div></div><div class="field"><label>배포 URL</label><input data-r="deploy" value="${esc(r.deploy||"")}"></div><label><input data-r="primary" type="checkbox" ${r.primary?"checked":""}> 대표 저장소</label><button type="button" class="btn danger" style="float:right" onclick="this.closest('.repo').remove()">삭제</button></div>`}
function addRepoField(){document.getElementById("repoFields").insertAdjacentHTML("beforeend",repoField())}
function saveProject(e,id){e.preventDefault();let f=new FormData(e.target),repos=[...document.querySelectorAll("#repoFields .repo")].map(el=>{let o={};el.querySelectorAll("[data-r]").forEach(x=>o[x.dataset.r]=x.type==="checkbox"?x.checked:x.value.trim());return o}).filter(r=>r.name||r.url);if(repos.filter(r=>r.primary).length>1){toast("대표 저장소는 하나만 지정할 수 있습니다.");return}let p={id:id||Date.now(),title:f.get("title").trim(),summary:f.get("summary").trim(),status:f.get("status"),visibility:f.get("visibility"),role:f.get("role").trim(),skills:f.get("skills").trim(),outcome:f.get("outcome").trim(),repos};if(id)projects=projects.map(x=>x.id===id?p:x);else projects.unshift(p);save();closeModal();renderAdmin();toast("프로젝트가 저장되었습니다.")}
function detail(id){let p=projects.find(x=>x.id===id);document.getElementById("modalRoot").innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>${esc(p.title)}</h2><button class="btn light" onclick="closeModal()">닫기</button></div><p class="muted">${esc(p.summary)}</p><p><span class="pill">${p.status}</span> <span class="pill">${p.visibility}</span></p><h3>담당 역할</h3><p>${esc(p.role||"-")}</p><h3>기술 스택</h3><p>${esc(p.skills||"-")}</p><h3>성과</h3><p>${esc(p.outcome||"-")}</p><h3>연결 저장소</h3>${p.repos.map(r=>`<div class="repo"><b>${esc(r.name)}</b> · ${r.vis}<br><a href="${esc(r.url)}" target="_blank">${esc(r.url)}</a></div>`).join("")||"등록된 저장소 없음"}<div class="row" style="justify-content:flex-end"><button class="btn light" onclick="editProject(${id})">수정</button><button class="btn danger" onclick="deleteProject(${id})">삭제</button></div></div></div>`}
function deleteProject(id){if(!confirm("이 프로젝트를 삭제할까요?"))return;projects=projects.filter(x=>x.id!==id);save();closeModal();renderAdmin();toast("삭제되었습니다.")}
function setVisibility(id,v){projects=projects.map(p=>p.id===id?{...p,visibility:v}:p);save();renderAdmin();toast("공개 설정이 변경되었습니다.")}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}
function renderPublic(){let visible=projects.filter(p=>p.visibility==="공개");document.getElementById("publicContent").innerHTML=`<div class="pubnav"><div class="brand">PORTFOLIO<span>·</span>STUDIO</div><button class="btn light" onclick="setMode('admin')">관리자 화면</button></div><section class="hero"><div class="eyebrow">DEVELOPER PORTFOLIO</div><h1>문제를 구조화하고,<br>서비스로 구현합니다.</h1><p>프로젝트의 목표와 역할, 기술적 선택, 결과를 기록하는 개인 개발 포트폴리오입니다.</p><div class="row"><span class="tag">Software Engineering</span><span class="tag">Full-stack Development</span><span class="tag">System Design</span></div></section><section class="pubsection"><div class="eyebrow">SELECTED WORK</div><h2>공개 프로젝트 <span class="muted">(${visible.length})</span></h2><div class="pubcards">${visible.map(p=>`<article class="pubcard"><span class="pill">${p.status}</span><h3>${esc(p.title)}</h3><p class="muted">${esc(p.summary)}</p><p>${p.skills.split(",").filter(Boolean).map(s=>`<span class="tag">${esc(s.trim())}</span>`).join("")}</p><button class="btn light" onclick="publicDetail(${p.id})">프로젝트 상세 →</button></article>`).join("")||'<div class="empty">공개된 프로젝트가 없습니다.</div>'}</div></section><section class="pubsection"><div class="eyebrow">ABOUT</div><h2>소개</h2><p class="muted">프로젝트 경험과 기술적 의사결정, 구현 결과를 중심으로 경력을 소개합니다. 실제 프로필 정보는 관리자 설정에서 구성합니다.</p></section><footer class="muted">© 2026 Personal Portfolio · Public view</footer>`}
function publicDetail(id){let p=projects.find(x=>x.id===id&&x.visibility==="공개");if(!p)return;document.getElementById("modalRoot").innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>${esc(p.title)}</h2><button class="btn light" onclick="closeModal()">닫기</button></div><p>${esc(p.summary)}</p><h3>담당 역할</h3><p>${esc(p.role||"-")}</p><h3>기술 스택</h3><p>${esc(p.skills||"-")}</p><h3>성과</h3><p>${esc(p.outcome||"-")}</p><h3>공개 저장소</h3>${p.repos.filter(r=>r.vis==="Public").map(r=>`<div class="repo"><b>${esc(r.name)}</b><br><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.url)}</a></div>`).join("")||'<p class="muted">공개 가능한 저장소가 없습니다.</p>'}</div></div>`}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
renderAdmin();
</script></body></html>
